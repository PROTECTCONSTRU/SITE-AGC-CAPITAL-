<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
    <!-- Icone: 3 figuras em azuis degradê -->
    <!-- Figura 1 (azul claro) -->
    <circle cx="32" cy="22" r="10" fill="#4FC3F7"/>
    <rect x="22" y="36" width="20" height="8" rx="2" fill="#4FC3F7"/>
    <rect x="29" y="44" width="6" height="28" rx="2" fill="#4FC3F7"/>
    <!-- Figura 2 (azul médio) -->
    <circle cx="56" cy="20" r="11" fill="#2196F3"/>
    <rect x="44" y="36" width="24" height="8" rx="2" fill="#2196F3"/>
    <rect x="52" y="44" width="8" height="28" rx="2" fill="#2196F3"/>
    <!-- Figura 3 (azul escuro) -->
    <circle cx="82" cy="18" r="12" fill="#0D2137"/>
    <rect x="68" y="36" width="28" height="8" rx="2" fill="#0D2137"/>
    <rect x="76" y="44" width="9" height="28" rx="2" fill="#0D2137"/>
    <!-- Barra vertical divisora -->
    <rect x="104" y="10" width="3" height="62" rx="1.5" fill="#2196F3"/>
    <!-- Texto AGC -->
    <text x="116" y="52" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#6B7280" letter-spacing="2">AGC</text>
    <!-- Texto CAPITAL -->
    <text x="116" y="76" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2196F3" letter-spacing="3">CAPITAL</text>
</svg>
